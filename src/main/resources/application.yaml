spring:
  application:
    name: libraryapi
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:notifications}
    password: ${RABBITMQ_PASSWORD:notifications}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: ${SERVER_PORT:8000}

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  page-title: Library API

security:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/jwt-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/jwt-public.pem}
    key-id: ${JWT_KEY_ID:library-api-rs256-1}
    issuer: ${JWT_ISSUER:library-api}
    audience: ${JWT_AUDIENCE:library-services}
    access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
  refresh-token:
    expiration: ${REFRESH_TOKEN_EXPIRATION:7d}
  login-attempts:
    enabled: ${LOGIN_ATTEMPTS_ENABLED:true}
    max-attempts: ${LOGIN_MAX_ATTEMPTS:3}
    window: ${LOGIN_ATTEMPT_WINDOW:5m}

notifications:
  queue: ${NOTIFICATIONS_QUEUE:notifications.book-created}
  chunk-size: ${NOTIFICATIONS_CHUNK_SIZE:100}

logging:
  file:
    name: logs/libraryapi.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 500MB
  level:
    root: INFO
    com.vieira96.libraryapi: DEBUG
    org.springframework.security: WARN
